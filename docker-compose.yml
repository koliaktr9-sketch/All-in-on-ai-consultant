services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: consultant
      POSTGRES_PASSWORD: consultant
      POSTGRES_DB: consultant
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["./backend:/app", "private_uploads:/app/private_uploads"]
    depends_on: [db, redis]
  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
  private_uploads:
